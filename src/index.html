<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}"></title>
    <!-- 首页分享卡片：kb-theme 新增 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" th:content="${site.title}" />
    <meta property="og:title" th:content="${site.title}" />
    <meta property="og:description" th:content="${site.subtitle}" />
    <meta property="og:url" th:content="${site.url}" />
    <meta property="og:image" th:unless="${#strings.isEmpty(site.logo)}" th:content="${site.logo}" />
  </template>
  <template name="hero">
    <th:block th:replace="~{modules/hero :: hero(isHome = true, cover = null, title = null)}" />
  </template>

  <section class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 md:grid-cols-[1fr_18rem] lg:px-6">
    <div class="z-0 min-w-0">
      <!-- kb-theme：首页分类导航（按场景找建议），可在主题设置 → 布局 关闭 -->
      <th:block th:if="${theme.config.layout.home_category_nav}" th:with="categories = ${categoryFinder.listAsTree()}">
        <section th:if="${not #lists.isEmpty(categories)}" class="kb-nav">
          <header class="kb-nav-head">
            <h2 class="kb-nav-title" th:text="${theme.config.layout.home_category_nav_title}">按场景找建议</h2>
            <p class="kb-nav-sub" th:text="${theme.config.layout.home_category_nav_subtitle}">
              每条建议都标了成本、收益、证据等级，并给出来源
            </p>
          </header>
          <div class="kb-nav-grid">
            <a
              th:each="category : ${categories}"
              th:href="@{${category.status.permalink}}"
              class="kb-nav-card"
              th:classappend="${not #lists.isEmpty(category.children)} ? 'kb-nav-card-group' : ''"
            >
              <span class="kb-nav-name" th:text="${category.spec.displayName}"></span>
              <span class="kb-nav-count" th:text="|${category.postCount ?: 0} 条|"></span>
              <span
                class="kb-nav-desc"
                th:unless="${#strings.isEmpty(category.spec.description)}"
                th:text="${#strings.abbreviate(category.spec.description, 60)}"
              ></span>
              <span class="kb-nav-children" th:if="${not #lists.isEmpty(category.children)}">
                <span th:each="child : ${category.children}" class="kb-nav-child" th:text="${child.spec.displayName}"></span>
              </span>
            </a>
          </div>
        </section>
        <!-- 导航开启时，首页不再列单条文章流；可选再列一个分类（比如「附录」）的文章 -->
        <th:block th:unless="${#strings.isEmpty(theme.config.layout.home_extra_category)}"
          th:with="extra = ${postFinder.listByCategory(1, 12, theme.config.layout.home_extra_category)}">
          <section th:if="${extra.total gt 0}" class="kb-extra">
            <h2 class="kb-latest-title" th:text="${theme.config.layout.home_extra_title}">附录</h2>
            <div class="mt-2 grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
              <th:block th:each="post : ${extra.items}">
                <th:block th:replace="~{modules/post-card :: post-card(${post},true,true,true,'row')}" />
              </th:block>
            </div>
          </section>
        </th:block>
      </th:block>
      <th:block th:unless="${theme.config.layout.home_category_nav}"><th:block th:replace="~{modules/category-filter}" /></th:block>

      <div
        id="post-list"
        th:if="${posts.total gt 0 and not theme.config.layout.home_category_nav}"
        th:with="postItems=${posts.items},list_layout=${theme.config.layout.post_list_layout}"
        class="mt-6 grid grid-cols-1 gap-6"
        th:classappend="|${list_layout == 'grid_3' ? 'md:grid-cols-2 xl:grid-cols-3' : ''} ${list_layout == 'grid_2' ? 'md:grid-cols-2' : ''}|"
      >
        <th:block th:each="post : ${postItems}">
          <th:block
            th:replace="~{modules/post-card :: post-card(${post},true,true,true,${list_layout == 'single' ? 'column' : 'row'})}"
          />
        </th:block>
      </div>

      <div th:if="${posts.total == 0}" class="mt-6 flex items-center justify-center">
        <span class="text-sm font-light text-gray-600" th:text="#{common.noPosts}"></span>
      </div>

      <th:block th:unless="${theme.config.layout.home_category_nav}">
        <th:block
          th:replace="~{modules/pagination :: pagination(context = '/', prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
        />
      </th:block>
    </div>
    <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
  </section>
</include>
