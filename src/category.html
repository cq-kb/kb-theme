<include src="layout.html">
  <template name="head">
    <title th:text="|#{page.category.title(${category.spec.displayName})} - ${site.title}|"></title>
  </template>
  <template name="hero">
    <th:block th:replace="~{modules/hero :: hero(isHome = true, cover = null, title = null)}" />
  </template>
  <section class="mx-auto mt-6 grid max-w-7xl grid-cols-1 gap-6 px-4 md:grid-cols-[1fr_18rem] lg:px-6">
    <!-- 注意：同一个 th:with 里后面的变量引用不到前面的（Halo 的 SpringEL 下 chapterNo 为 null），所以分两层 -->
    <div class="z-0 min-w-0" th:with="dotIndex=${#strings.indexOf(category.spec.displayName, '.')}">
     <th:block th:with="isChapter=${dotIndex gt 0 and dotIndex le 2}, chapterNo=${#strings.substringBefore(category.spec.displayName, '.')}">
      <!-- kb-theme：章节分类页（分类名形如「1. 不要早死」）——章说明 + 整章连读 + 条目列表 -->
      <section th:if="${isChapter}" class="kb-chapter">
        <h1 class="kb-chapter-title" th:text="${category.spec.displayName}"></h1>
        <p class="kb-chapter-desc" th:unless="${#strings.isEmpty(category.spec.description)}" th:text="${category.spec.description}"></p>
        <div class="kb-chapter-meta">
          <span th:text="|${posts.total} 条建议|"></span>
          <a
            class="kb-chapter-full"
            th:href="|/archives/how-to-live-better-${#strings.length(chapterNo) == 1 ? '0' + chapterNo : chapterNo}|"
            >整章连读 →</a
          >
        </div>
      </section>
      <ol th:if="${isChapter and posts.total gt 0}" class="kb-entry-list">
        <li th:each="post : ${posts.items}" class="kb-entry-item">
          <a th:href="@{${post.status.permalink}}" class="kb-entry-link">
            <span class="kb-entry-item-title" th:text="${post.spec.title}"></span>
            <span class="kb-entry-item-excerpt" th:text="${post.status.excerpt}"></span>
          </a>
          <th:block th:each="tag : ${post.tags}">
            <span
              th:if="${#strings.startsWith(tag.spec.displayName, '证据等级')}"
              class="kb-evidence"
              th:classappend="'kb-evidence-' + ${#strings.toLowerCase(#strings.trim(#strings.substringAfter(tag.spec.displayName, '证据等级')))}"
              th:text="${#strings.trim(#strings.substringAfter(tag.spec.displayName, '证据等级'))}"
              title="证据等级"
            ></span>
          </th:block>
        </li>
      </ol>

      <th:block th:unless="${isChapter}"><th:block th:replace="~{modules/category-filter}" /></th:block>

      <div
        id="post-list"
        th:if="${not isChapter and posts.total gt 0}"
        th:with="postItems=${posts.items},list_layout=${theme.config.layout.post_list_layout}"
        class="mt-6 grid grid-cols-1 gap-6"
        th:classappend="|${list_layout == 'grid_3' ? 'md:grid-cols-2 xl:grid-cols-3' : ''} ${list_layout == 'grid_2' ? 'md:grid-cols-2' : ''}|"
      >
        <th:block th:each="post : ${postItems}">
          <th:block
            th:replace="~{modules/post-card :: post-card(${post},true,true,true,${list_layout == 'single' ? 'column' : 'row'})}"
          />
        </th:block>
      </div>

      <div th:if="${posts.total == 0}" class="mt-6 flex items-center justify-center">
        <span class="text-sm font-light text-gray-600 dark:text-slate-200" th:text="#{common.noPosts}"></span>
      </div>

      <th:block
        th:replace="~{modules/pagination :: pagination(context = |${category.status.permalink}/|, prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
      />
     </th:block>
    </div>
    <th:block th:replace="~{modules/sidebar :: sidebar(prepend = null)}" />
  </section>
</include>
